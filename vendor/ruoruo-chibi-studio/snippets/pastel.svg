<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300" data-snippet="pastel@2026-11-24">
<!--
油画棒正式滤镜（render.mjs --pastel 同一套，2026-11-24）。
B 路线交油画棒成品时：把下面 <defs> 里两个 <filter> 整段复制进你的 <defs>。
- 一个字都不改，不删、不简写、不凭记忆重写。少一个 primitive 文件照样合法，但 Safari 会把滤镜区域显示成灰色方块。
- 只允许给 id 加前缀（双角色：a-pastel、a-pastel-fine），引用的 url(#…) 跟着改。
- 角色按图层顺序切成连续几段：眼睛、虹膜、高光、睫毛、眉、鼻子、人中线、嘴线、嘴边弧线、胡须、舌，和所有没有填充的线条，包在 <g filter="url(#pastel-fine)">；其它部件包在 <g filter="url(#pastel)">。背景色块不包。
-->
<defs>
<filter id="pastel" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="2 1.516" numOctaves="3" seed="11" result="fibres"/><feDisplacementMap in="SourceGraphic" in2="fibres" scale="2" xChannelSelector="R" yChannelSelector="G" result="edges"/><feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope=".61" intercept=".20"/><feFuncG type="linear" slope=".61" intercept=".20"/><feFuncB type="linear" slope=".61" intercept=".20"/></feComponentTransfer><feBlend in2="edges" mode="soft-light"/><feComposite in2="edges" operator="in"/></filter>
<filter id="pastel-fine" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="2 1.516" numOctaves="3" seed="11" result="fibres"/><feDisplacementMap in="SourceGraphic" in2="fibres" scale="1.1" xChannelSelector="R" yChannelSelector="G" result="edges"/><feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope=".61" intercept=".20"/><feFuncG type="linear" slope=".61" intercept=".20"/><feFuncB type="linear" slope=".61" intercept=".20"/></feComponentTransfer><feBlend in2="edges" mode="soft-light"/><feComposite in2="edges" operator="in"/></filter>
</defs>
<g filter="url(#pastel)"><rect x="20" y="20" width="60" height="60" rx="14" fill="#f2b98a"/></g><g filter="url(#pastel-fine)"><ellipse cx="40" cy="50" rx="3" ry="4" fill="#4a3b3b"/><ellipse cx="60" cy="50" rx="3" ry="4" fill="#4a3b3b"/></g>
</svg>
